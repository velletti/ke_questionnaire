<f:asset.script identifier="keq-questionnaire-progressbar">
	var progressValue = (({questionnaire.page} / {questionnaire.countPages}) * 100);
	jQuery(function() {
		jQuery( "#keqPageProgressbar" ).progressbar({
			value: progressValue
		});
	});
</f:asset.script>
<div id="progressbar-wrap"><div class="keqProgressbar" id="keqPageProgressbar"></div><div class="progress-label">{questionnaire.page} / {questionnaire.countPages}</div></div>
